server:
  assets-path: /app/assets

theme:
  # Note: assets are cached by the browser, changes to the CSS file
  # will not be reflected until the browser cache is cleared (Ctrl+F5)
  custom-css-file: /assets/user.css
  background-color: 240 27 11
  contrast-multiplier: 1.5
  primary-color: 321 100 71
  positive-color: 165 78 51
  negative-color: 360 100 71

pages:
  - name: Home
    hide-desktop-navigation: false
    show-mobile-header: true
    columns:
      - size: small
        widgets:
          - type: weather
            location: Modena, Italy
            units: metric
            hour-format: 24h
            # Optionally hide the location from being displayed in the widget
            # hide-location: true

          - type: calendar
            first-day-of-week: monday

          - type: monitor
            cache: 1m
            title: Services
            sites:
              - title: portainer
                url: https://portainer.leonardonels.com/
                icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/portainer-dark.png
              - title: pi-hole
                url: https://pi-hole.leonardonels.com/admin
                icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/pi-hole.png
              - title: vaultwarden
                url: https://vaultwarden.leonardonels.com/
                icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/bitwarden.png
              - title: invoke-ai
                url: https://invoke-ai.leonardonels.com/
                icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/invoke-ai.png
              - title: nextcloud
                url: https://nextcloud.leonardonels.com/
                icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/nextcloud-white.png
              - title: immich
                url: https://immich.leonardonels.com/
                icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/immich.png
              - title: n8n
                url: https://n8n.leonardonels.com/
                icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/n8n.png
              - title: home-assistant
                url: https://home.leonardonels.com/
                icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/home-assistant.png
              - title: gpu-hot
                url: https://hot.leonardonels.com/
                icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/nvidia.png
              - title: S.M.A.R.T. Monitor
                url: https://scrutiny.leonardonels.com/
                icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/terminal.png
              - title: open-ai
                url: https://openai.leonardonels.com/
                icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/open-webui-light.png
              - title: crafty
                url: https://crafty.leonardonels.com/
                icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/minecraft.png
              - title: floratech
                url: https://floratech.leonardonels.com/
                icon: https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fwebstockreview.net%2Fimages%2Fplants-clipart-emoji-3.png&f=1&nofb=1&ipt=04771143245d27c08807b1516957ea70c5b85f741f49b033da2576758651844c
              - title: openlinkhub
                url: http://192.168.178.49:27003/
                icon: si:corsair

      - size: full
        widgets:
          # Written by scripts/{docker-update,system-update,healthcheck}.sh, see scripts/README.md.
          - type: custom-api
            title: Roxan maintenance
            cache: 1m
            url: http://127.0.0.1:8080/assets/roxan-status.json
            template: |
              {{ define "state" }}{{ if eq . "ok" }}color-positive{{ else if or (eq . "running") (eq . "rebooting") (eq . "repaired") }}color-highlight{{ else }}color-negative{{ end }}{{ end }}
              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px;">
                <div>
                  {{ $s := .JSON.String "docker.state" }}
                  <div class="size-h5 color-subdue">DOCKER UPDATES</div>
                  <div class="size-h2 {{ template "state" $s }}">{{ if $s }}{{ $s }}{{ else }}never run{{ end }}</div>
                  {{ if .JSON.Exists "docker.finished" }}
                  <div class="size-h6 color-subdue">last run <span {{ .JSON.String "docker.finished" | parseTime "RFC3339" | toRelativeTime }}></span> ago · {{ .JSON.Int "docker.duration_s" }}s</div>
                  {{ end }}
                  <ul class="list list-gap-2 margin-top-10 size-h6">
                    <li>{{ len (.JSON.Array "docker.current") }} up to date</li>
                    {{ if .JSON.Array "docker.updated" }}<li class="color-positive">updated: {{ range .JSON.Array "docker.updated" }}{{ .String "" }} {{ end }}</li>{{ end }}
                    {{ if .JSON.Array "docker.rolled_back" }}<li class="color-negative">rolled back: {{ range .JSON.Array "docker.rolled_back" }}{{ .String "" }} {{ end }}</li>{{ end }}
                    {{ range .JSON.Array "docker.failed" }}<li class="color-negative">{{ .String "" }}</li>{{ end }}
                    {{ range .JSON.Array "docker.skipped" }}<li class="color-subdue">{{ .String "" }}</li>{{ end }}
                  </ul>
                </div>
                <div>
                  {{ $s := .JSON.String "system.state" }}
                  <div class="size-h5 color-subdue">SYSTEM UPDATES</div>
                  <div class="size-h2 {{ template "state" $s }}">{{ if $s }}{{ $s }}{{ else }}never run{{ end }}</div>
                  {{ if .JSON.Exists "system.finished" }}
                  <div class="size-h6 color-subdue">last run <span {{ .JSON.String "system.finished" | parseTime "RFC3339" | toRelativeTime }}></span> ago · {{ len (.JSON.Array "system.upgraded") }} packages</div>
                  {{ end }}
                  <ul class="list list-gap-2 margin-top-10 size-h6">
                    <li>kernel {{ .JSON.String "system.kernel" }}</li>
                    <li>NVIDIA {{ .JSON.String "system.nvidia_installed" }}{{ if ne (.JSON.String "system.nvidia_loaded") (.JSON.String "system.nvidia_installed") }} <span class="color-negative">(loaded {{ .JSON.String "system.nvidia_loaded" }})</span>{{ end }}</li>
                    {{ if .JSON.String "system.reboot_pending" }}<li class="color-highlight">reboot pending: {{ .JSON.String "system.reboot_pending" }}</li>{{ end }}
                    {{ range .JSON.Array "system.problems" }}<li class="color-negative">{{ .String "" }}</li>{{ end }}
                    {{ if .JSON.Exists "reboot.at" }}<li class="color-subdue">last auto-reboot <span {{ .JSON.String "reboot.at" | parseTime "RFC3339" | toRelativeTime }}></span> ago: {{ .JSON.String "reboot.reason" }}</li>{{ end }}
                  </ul>
                </div>
                <div>
                  {{ $s := .JSON.String "health.state" }}
                  <div class="size-h5 color-subdue">HEALTH</div>
                  <div class="size-h2 {{ template "state" $s }}">{{ if $s }}{{ $s }}{{ else }}no data{{ end }}</div>
                  {{ if .JSON.Exists "health.checked" }}
                  <div class="size-h6 color-subdue">checked <span {{ .JSON.String "health.checked" | parseTime "RFC3339" | toRelativeTime }}></span> ago · up {{ .JSON.String "health.uptime" }}</div>
                  {{ end }}
                  <ul class="list list-gap-2 margin-top-10 size-h6">
                    {{ range .JSON.Array "health.issues" }}<li class="color-negative">{{ .String "" }}</li>{{ end }}
                    {{ if .JSON.Bool "health.reboot_required" }}<li class="color-highlight">reboot required</li>{{ end }}
                    {{ if .JSON.Exists "health.last_repair" }}<li class="color-subdue">last repair <span {{ .JSON.String "health.last_repair" | parseTime "RFC3339" | toRelativeTime }}></span> ago: {{ range .JSON.Array "health.last_repair_actions" }}{{ .String "" }}; {{ end }}</li>{{ end }}
                  </ul>
                </div>
              </div>

          - type: split-column
            widgets:
              - type: lobsters
                sort-by: hot
                tags:
                  - hardware
                  - networking
                  - security
                  - android
                  - linux
                  - vibecoding
                limit: 20
                collapse-after: 10

              - type: hacker-news
                limit: 15
                collapse-after: 10
                sort-by: top

          - type: videos
            channels:
              - UCIdYIrInVnUwHVbogLj6bqA  # Riccardo Palombo
              - UCgdTVe88YVSrOZ9qKumhULQ  # Hardware Haven
              - UCsnGwSIHyoYN0kiINAGUKxg  # Wolfgang's Channel
              - UC9x0AN7BWHpCDHSm9NiJFJQ  # Network Chuck
              - UCRYOj4DmyxhBVrdvbsUwmAA  # Optimum Tech
              - UCWa1XQsNX1xk4uMIPw7mM0g  # PC SNAP
              - UCBpFmXURDoUpKGj43Uot0Ag  # ITG Gear
              - UCGHzpEcSwfBQJAitgw2pgVQ  # Mr Matt Lee
            limit: 64
            style: horizontal-list
  
      - size: small
        widgets:
          - type: custom-api
            title: Steam Specials
            cache: 12h
            frameless: false
            url: https://store.steampowered.com/api/featuredcategories?cc=us
            template: |
              <ul class="list list-gap-10 collapsible-container" data-collapse-after="5">
              {{ range .JSON.Array "specials.items" }}
                <li>
                  <a class="size-h4 color-highlight block text-truncate" href="https://store.steampowered.com/app/{{ .Int "id" }}/">{{ .String "name" }}</a>
                  <ul class="list-horizontal-text">
                    <li>{{ div (.Int "final_price" | toFloat) 100 | printf "$%.2f" }}</li>
                    {{ $discount := .Int "discount_percent" }}
                    <li{{ if ge $discount 40 }} class="color-positive"{{ end }}>{{ $discount }}% off</li>
                  </ul>
                </li>
              {{ end }}
              </ul>

          - type: server-stats
            servers:
              - type: local
                name: ROXAN
                hide-mountpoints-by-default: true
                mountpoints:
                  "/":
                    hide: false
                    name: docker-host
                  "/mnt/data":
                    hide: false
                    name: massive-storage

          # Corsair iCUE LINK H100i via OpenLinkHub (compose/openlinkhub). Web UI: http://192.168.178.49:27003
          - type: custom-api
            title: Cooler
            title-url: http://192.168.178.49:27003
            cache: 30s
            url: http://192.168.178.49:27003/api/devices/8335B5AC4416625EAD27AC1494DD02BD
            template: |
              <ul class="list list-gap-10">
              {{ range .JSON.Array "device.devices.@values" }}
                <li class="flex justify-between items-center">
                  <div>
                    <div class="size-h4 color-highlight">{{ if .Bool "AIO" }}Pump · liquid{{ else }}{{ .String "name" | trimPrefix "iCUE LINK " }} fan{{ end }}</div>
                    <div class="size-h6 color-subdue">{{ .String "profile" }} profile</div>
                  </div>
                  <div class="text-right">
                    <div class="size-h4 {{ if and (.Bool "AIO") (lt (.Int "rpm") 500) }}color-negative{{ end }}">{{ .Int "rpm" }} rpm</div>
                    <div class="size-h6 {{ if and (.Bool "AIO") (ge (.Float "temperature") 50.0) }}color-negative{{ end }}">{{ printf "%.1f" (.Float "temperature") }} °C</div>
                  </div>
                </li>
              {{ end }}
              </ul>

          - type: docker-containers
            hide-by-default: true
            containers:
              glance:
                name: Glance
                icon: si:glance
                hide: false
              pihole:
                name: Pi-hole
                icon: si:pi-hole
                hide: false
              vaultwarden:
                name: Vaultwarden
                icon: si:bitwarden
                hide: false
              portainer:
                name: Portainer
                icon: si:portainer
                hide: false
              ollama:
                name: Ollama
                icon: si:ollama
                hide: false
              invokeai-invokeai-cuda-1:
                name: InvokeAI
                hide: false
              nextcloud-aio-mastercontainer:
                name: Nextcloud
                icon: si:nextcloud
                hide: false
              crafty_container:
                name: Minecraft
                icon: si:minecraft
                hide: false
              cloudflare-tunnel:
                name: Cloudflared
                icon: si:cloudflare
                hide: false
              immich_server:
                name: Immich
                icon: si:immich
                hide: false
              floratech_daphne:
                name: FloraTech
                icon: si:django
                hide: false
              n8n:
                name: n8n
                icon: si:n8n
                hide: false
              gpu-hot:
                name: GPU Hot
                icon: si:docker
                hide: false
              scalable-ai-lab:
                name: AI powered by Nvidia
                icon: si:nvidia
                hide: false
              scrutiny:
                name: S.M.A.R.T.
                icon: si:speedtest
                hide: false
              openlinkhub:
                name: Corsair iCUE
                icon: si:corsair
                hide: false
              openrgb:
                name: FTW3 LED Control
                icon: auto-invert /assets/openrgb-flat.png
                hide: false

