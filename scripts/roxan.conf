# Settings for the maintenance scripts in this folder. Sourced by lib.sh.
# Secrets (notification tokens) do NOT go here: put them in scripts/roxan.env (gitignored),
# see roxan.env.example.

COMPOSE_DIR="$ROXAN_ROOT/compose"

# DNS used by containers (install.sh writes it to /etc/docker/daemon.json): Pi-hole on this host
# first, a public resolver when Pi-hole doesn't answer (at boot before it's up, or if it's broken).
DNS_SERVERS=(192.168.178.49 1.1.1.1)

# --- docker-update.sh --------------------------------------------------------
# compose/ folders never touched. Projects with no running container are skipped anyway
# (playit, mmr, ...), so this is for things that run but must stay frozen.
DOCKER_SKIP=()
# compose/ folders whose `build:` services get rebuilt on fresh base images (`build --pull`).
# The CUDA images (cuda, sam3, mmr) are huge and slow to build: leave them out unless you want that.
# invokeai must stay: its Dockerfile swaps in Pascal-capable PyTorch on top of the pinned release (and
# fails the build, keeping the running image, if a release's torch has no cu126 build).
DOCKER_REBUILD=(floratech gpu-hot invokeai)
# Updated last, in this order: the host resolves DNS through pi-hole, and remote access
# goes through cloudflared.
DOCKER_LAST=(pi-hole cloudflared)
# Nextcloud AIO updates itself and its sibling containers through the mastercontainer's own
# updater (docs/nextcloud-aio/readme.md, "automatic updates"). Empty to leave Nextcloud alone.
NEXTCLOUD_AIO_PROJECT=nextcloud
# Seconds a project gets to be running/healthy after recreating, before it counts as failed.
DOCKER_WAIT_TIMEOUT=600
# compose/ folders never rolled back: their database is migrated on the first start of a new
# version, and the old version won't start on it any more. A failed update is reported instead.
DOCKER_NO_ROLLBACK=(immich-app)

# --- system-update.sh --------------------------------------------------------
# NVIDIA driver branch to stay on. 580 is the last branch that supports Pascal (and Maxwell/Volta);
# install.sh pins apt so no other branch can be pulled in.
NVIDIA_BRANCH=580
# Reboot automatically when an update needs it (kernel, libc, NVIDIA driver).
AUTO_REBOOT=1
# Never reboot automatically twice within this many hours (protects against reboot loops).
REBOOT_MIN_INTERVAL_H=20

# --- healthcheck.sh (runs every 5 minutes) -----------------------------------
# Restart a container after it has been unhealthy for this many consecutive checks...
UNHEALTHY_CHECKS=3
# ...but not more often than once every this many minutes.
RESTART_COOLDOWN_MIN=60
# Hosts pinged to tell whether the internet is reachable.
PING_HOSTS=(1.1.1.1 8.8.8.8 192.168.178.1)
# Consecutive failed checks before restarting systemd-networkd (6 = ~30 min)...
NET_RESTART_AFTER=6
# ...and before rebooting (36 = ~3 h). Still subject to REBOOT_MIN_INTERVAL_H.
NET_REBOOT_AFTER=36
# OpenLinkHub API of the iCUE LINK System Hub (compose/openlinkhub); empty to disable the cooler check.
COOLER_API=http://127.0.0.1:27003/api/devices/8335B5AC4416625EAD27AC1494DD02BD
# Report a problem when the AIO pump spins slower than this, or the liquid is hotter than this.
PUMP_MIN_RPM=1000
LIQUID_MAX_C=50
# Mountpoints watched for free space, and the usage % that triggers a docker cleanup + warning.
DISK_MOUNTS=(/ /mnt/data)
DISK_WARN_PCT=90
