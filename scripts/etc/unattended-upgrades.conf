// Installed by scripts/install.sh as /etc/apt/apt.conf.d/52roxan-unattended.
// Kernel and NVIDIA packages are left to scripts/system-update.sh (weekly), which upgrades
// them together and reboots right after. When unattended-upgrades replaced the NVIDIA
// libraries mid-week, NVML broke ("Driver/library version mismatch") and no GPU container
// could start until the next reboot. Everything else still gets daily security updates.
Unattended-Upgrade::Package-Blacklist {
    "linux-";
    "nvidia-";
    "libnvidia-";
    "xserver-xorg-video-nvidia-";
};
