services:
  mmr:
    build: .
    image: mmr:humble
    container_name: mmr
    stdin_open: true
    tty: true
    env_file:
      - .env
    volumes:
      - /opt/docker/roxan/data/mmr/ws:/root/ws
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: bash
